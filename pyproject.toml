[project]
name = "apk-installer"
version = "0.1.0"
description = "Parallel APK installer for multiple Android devices"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyinstaller",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PT", "RET", "RSE"]
ignore = []

[project.scripts]
apk-installer = "apk_installer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
